<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#1B1B1B"/>
  <rect x="1" y="1" width="798" height="448" stroke="#303030" stroke-width="2"/>
  <!-- Subtle decorative grid -->
  <line x1="0" y1="90" x2="800" y2="90" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#252525" stroke-dasharray="4 4"/>
  <!-- Emerald accent badge -->
  <rect x="60" y="60" width="120" height="32" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981"/>
  <text x="120" y="80" text-anchor="middle" dominant-baseline="central" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">LIVE APP</text>
  <!-- Main Title -->
  <text x="60" y="160" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="700">Hotel Evento</text>
  <!-- Subtitle -->
  <text x="60" y="200" fill="#A3A3A3" font-family="'Space Grotesk', sans-serif" font-size="16">Hospitality &amp; Event Services Showcase</text>
  <!-- Tech badges -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="75" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="37" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">React</text>
    
    <rect x="85" y="0" width="95" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="132" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">JavaScript</text>
    
    <rect x="190" y="0" width="110" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="245" y="14" text-anchor="middle" dominant-baseline="central" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">Tailwind CSS</text>
    
    <rect x="310" y="0" width="70" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="345" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">HTML</text>
    
    <rect x="390" y="0" width="65" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="422" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">CSS</text>
  </g>
  <!-- Geometric element -->
  <rect x="620" y="165" width="120" height="120" rx="8" stroke="#303030" stroke-width="1.5"/>
  <rect x="645" y="190" width="70" height="70" rx="4" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="680" cy="225" r="16" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
</svg>
