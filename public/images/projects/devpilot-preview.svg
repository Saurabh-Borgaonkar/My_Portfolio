<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#1B1B1B"/>
  <rect x="1" y="1" width="798" height="448" stroke="#303030" stroke-width="2"/>
  <!-- Subtle decorative grid -->
  <line x1="0" y1="90" x2="800" y2="90" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#252525" stroke-dasharray="4 4"/>
  <!-- Emerald accent badge -->
  <rect x="60" y="60" width="120" height="32" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981"/>
  <text x="120" y="80" text-anchor="middle" dominant-baseline="central" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">FEATURED</text>
  <!-- Main Title -->
  <text x="60" y="160" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="700">DevPilot AI</text>
  <!-- Subtitle -->
  <text x="60" y="200" fill="#A3A3A3" font-family="'Space Grotesk', sans-serif" font-size="16">AI-Powered Developer Assistant</text>
  <!-- Tech badges -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="85" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="42" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">Node.js</text>
    
    <rect x="95" y="0" width="95" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="142" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">Express.js</text>
    
    <rect x="200" y="0" width="85" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="242" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">MongoDB</text>
    
    <rect x="295" y="0" width="130" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="360" y="14" text-anchor="middle" dominant-baseline="central" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">AI API Integration</text>
  </g>
  <!-- Geometric element -->
  <circle cx="680" cy="225" r="80" stroke="#303030" stroke-width="1.5"/>
  <circle cx="680" cy="225" r="45" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="660" y="205" width="40" height="40" stroke="#10B981" stroke-width="1.5" transform="rotate(45 680 225)"/>
</svg>
