<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#1B1B1B"/>
  <rect x="1" y="1" width="798" height="448" stroke="#303030" stroke-width="2"/>
  <!-- Subtle decorative grid -->
  <line x1="0" y1="90" x2="800" y2="90" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#252525" stroke-dasharray="4 4"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#252525" stroke-dasharray="4 4"/>
  <!-- Emerald accent badge -->
  <rect x="60" y="60" width="120" height="32" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981"/>
  <text x="120" y="80" text-anchor="middle" dominant-baseline="central" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">MERN STACK</text>
  <!-- Main Title -->
  <text x="60" y="160" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700">Learning Management System</text>
  <!-- Subtitle -->
  <text x="60" y="200" fill="#A3A3A3" font-family="'Space Grotesk', sans-serif" font-size="16">Digital Course Access Platform</text>
  <!-- Tech badges -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="80" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="40" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">React.js</text>
    
    <rect x="90" y="0" width="85" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="132" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">Node.js</text>
    
    <rect x="185" y="0" width="95" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="232" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">Express.js</text>
    
    <rect x="290" y="0" width="85" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="332" y="14" text-anchor="middle" dominant-baseline="central" fill="#A3A3A3" font-family="'JetBrains Mono', monospace" font-size="11">MongoDB</text>
    
    <rect x="385" y="0" width="85" height="28" rx="4" fill="#101010" stroke="#303030"/>
    <text x="427" y="14" text-anchor="middle" dominant-baseline="central" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">Mongoose</text>
  </g>
  <!-- Geometric element -->
  <rect x="620" y="165" width="120" height="120" rx="8" stroke="#303030" stroke-width="1.5"/>
  <circle cx="680" cy="225" r="40" stroke="#10B981" stroke-width="1.5"/>
  <line x1="680" y1="185" x2="680" y2="265" stroke="#10B981" stroke-width="1.5"/>
  <line x1="640" y1="225" x2="720" y2="225" stroke="#10B981" stroke-width="1.5"/>
</svg>
