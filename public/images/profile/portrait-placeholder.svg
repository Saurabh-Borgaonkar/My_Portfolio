  <text x="300" y="610" text-anchor="middle" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600">Saurabh Borgaonkar</text>
  <text x="300" y="635" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">PORTRAIT PLACEHOLDER</text>
